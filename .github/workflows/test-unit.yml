name: "Test Unit"

on:
  workflow_call:
    inputs:
      update_badge:
        required: false
        type: boolean
        default: false
    secrets:
      GIST_TOKEN:
        required: false
      COVERAGE_GIST_ID:
        required: false

jobs:
  test-unit:
    name: "Unit tests with coverage"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: '**/go.sum'

      - name: Cache task-installed binaries
        uses: actions/cache@v5.0.5
        with:
          path: bin
          key: ${{ runner.os }}-task-bin-${{ hashFiles('Taskfile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-task-bin-

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Run unit tests with coverage
        run: task test:coverage

      - name: Update coverage badge gist
        if: inputs.update_badge
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          COVERAGE_GIST_ID: ${{ secrets.COVERAGE_GIST_ID }}
        run: |
          if [[ -z "${GIST_TOKEN:-}" || -z "${COVERAGE_GIST_ID:-}" ]]; then
            echo "Skip badge update: GIST_TOKEN or COVERAGE_GIST_ID is missing"
            exit 0
          fi
          task coverage:badge:update

      - name: Publish coverage to job summary
        if: always()
        run: |
          {
            echo "## 📊 Coverage report"
            echo ""
            echo '```'
            go tool cover -func=coverage/coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
